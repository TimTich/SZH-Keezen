<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Keezen Control Hub</title>
    <link rel="stylesheet" href="style.css?v=25">
</head>
<body>
    <div id="start-scherm" class="container">
        <h1 class="spel-titel">KEEZEN</h1>
        <div id="speler-status" class="speler-status">
            Wachten op spelers... (minimaal 2, maximaal 4)<br>
            <span id="speler-teller">0/4</span>
            <div id="jouw-speler" class="jouw-speler">Aanmelden...</div>
        </div>
        <button id="speel-knop" class="speel-knop uitgeschakeld" onclick="window.startSpel();">Speel</button>
        <div class="start-knoppen-rij">
            <button class="uitleg-knop" onclick="openUitlegKeezen()">Uitleg Keezen</button>
            <button class="uitleg-knop" onclick="openUitlegUI()">Uitleg UI</button>
        </div>
    </div>

    <div id="spel-scherm" class="container verborgen">
        <div class="pion pion-links-boven" data-id="pion-1" onclick="selecteerPion(this)"><span class="pos-label"></span></div>
        <div class="pion pion-rechts-boven" data-id="pion-2" onclick="selecteerPion(this)"><span class="pos-label"></span></div>
        <div class="pion pion-links-onder" data-id="pion-3" onclick="selecteerPion(this)"><span class="pos-label"></span></div>
        <div class="pion pion-rechts-onder" data-id="pion-4" onclick="selecteerPion(this)"><span class="pos-label"></span></div>
        <h1 id="instructie-tekst" class="spel-titel-klein">MAAK JE KEUZE</h1>
        <div id="huidige-beurt" class="beurt-indicator">HUIDIGE BEURT: wachten...</div>

        <div id="hand-kaarten" class="hand-kaarten-balk"></div>

        <button id="bevestig-knop" class="actie-knop uitgeschakeld" onclick="speelZet()">SPEEL</button>
        <div id="jouw-speler-game" class="jouw-speler-klein">Aanmelden...</div>

        <button class="stop-knop" onclick="stopSpel()">STOP SPEL</button>

        <div id="popup-7" class="popup-overlay verborgen">
            <div class="popup-container">
                <div class="popup-rij">
                    <div class="popup-pion-vak"><img src="pion.png" class="popup-pion-img"></div>
                    <div class="popup-stappen-vak" id="stappen-boven"></div>
                </div>
                <div class="popup-rij">
                    <div class="popup-pion-vak"><img src="pion.png" class="popup-pion-img"></div>
                    <div class="popup-stappen-vak" id="stappen-onder"></div>
                </div>
                <button id="zeven-speel-knop" class="popup-speel-knop uitgeschakeld" onclick="bevestig7Zet()">Speel</button>
            </div>
        </div>

        <div id="popup-boer" class="popup-overlay verborgen">
            <div class="popup-container boer-content">
                <h2 style="color: black; margin-bottom: 20px;">KIES EEN PION OM MEE TE RUILEN</h2>
                <div id="boer-tegenstanders-container"></div>
                <div style="display: flex; justify-content: center; gap: 20px; margin-top: 20px;">
                    <button id="boer-speel-knop" class="popup-speel-knop uitgeschakeld" onclick="bevestigBoerZet()">RUIL PIONNEN</button>
                    <button class="popup-speel-knop terug-knop" onclick="document.getElementById('popup-boer').classList.add('verborgen')">ANNULEER</button>
                </div>
            </div>
        </div>
    </div>

    <<script src="script.js?v=99999"></script>
</body>
</html>
